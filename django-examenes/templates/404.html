<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Página no encontrada</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#EEF1F0; font-family:'Inter', sans-serif; color:#1C2430; padding:24px;
  }
  .card{
    background:#fff; border:1px solid #E3E7E5; border-radius:14px;
    padding:44px 48px; max-width:480px; text-align:center;
    box-shadow:0 20px 50px rgba(20,24,28,.08);
  }
  .code{
    font-family:'Plus Jakarta Sans', sans-serif; font-size:52px; font-weight:800;
    color:#D33F3F; margin:0 0 6px; letter-spacing:-0.02em;
  }
  h1{font-family:'Plus Jakarta Sans', sans-serif; font-size:18px; margin:0 0 10px;}
  p{font-size:14px; color:#6B7480; line-height:1.6; margin:0 0 26px;}
  a{
    display:inline-block; background:#159A5B; color:#fff; text-decoration:none;
    font-family:'Plus Jakarta Sans', sans-serif; font-weight:600; font-size:13.5px;
    padding:10px 20px; border-radius:8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La dirección <strong>{{ request.path }}</strong> no existe en Gestión de Exámenes. Revisa la URL o vuelve al inicio.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
